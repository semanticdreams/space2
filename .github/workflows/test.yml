name: test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-22.04
    env:
      SKIP_KEYRING_TESTS: 1
      XDG_DATA_HOME: /tmp/space/tests/xdg-data
      SPACE_DISABLE_AUDIO: 1
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 1G
      CCACHE_BASEDIR: ${{ github.workspace }}
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      SCCACHE_CACHE_SIZE: 2G
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          deps=$(awk '/CI_DEPS_START/{flag=1;next}/CI_DEPS_END/{flag=0}flag' docs/dev/building.md | sed -n 's/^sudo apt install //p')
          # sccache not available via apt on Ubuntu 22.04 — install via cargo below
          deps=$(echo "$deps" | sed 's/\bsccache\b//g')
          sudo apt-get install -y ${deps} ccache

      - name: Setup compiler cache
        uses: ./.github/actions/setup-linux-compiler-cache
        with:
          cache-scope: linux
          ccache-path: .ccache
          sccache-path: .sccache
          ccache-key-files: |
            **/CMakeLists.txt
            **/*.cmake
            scripts/build-linux.sh
            scripts/build-appimage.sh
            Makefile
          sccache-key-files: |
            ffi/matrix/Cargo.lock
            ffi/matrix/Cargo.toml
            external/wallet-core/rust/Cargo.lock
            external/wallet-core/rust/Cargo.toml
            CMakeLists.txt

      - name: Configure git for test directories
        run: |
          set -euo pipefail
          git_config="${RUNNER_TEMP}/gitconfig"
          git config --file "${git_config}" user.name "CI Test"
          git config --file "${git_config}" user.email "ci@test.local"
          git config --file "${git_config}" --add safe.directory "${GITHUB_WORKSPACE}"
          git config --file "${git_config}" --add safe.directory /tmp/space/tests
          git config --file "${git_config}" protocol.file.allow always
          echo "GIT_CONFIG_GLOBAL=${git_config}" >> "${GITHUB_ENV}"
          echo "=== CI git config safe.directory ==="
          git config --file "${git_config}" --get-all safe.directory
          echo "=== CI git config protocol.file.allow ==="
          git config --file "${git_config}" protocol.file.allow

      - name: Check OpenCode capability wiring
        run: make opencode-check

      - name: Build
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: make BUILD_JOBS=$(nproc) build

      - name: ccache stats
        run: ccache -s

      - name: sccache stats
        run: |
          if command -v sccache >/dev/null 2>&1; then
            sccache --show-stats
            sccache --stop-server || true
          fi

      - name: Run test suite
        env:
          SPACE_ASSETS_PATH: ${{ github.workspace }}/assets
          SPACE_TEST_REQUIRE_SSH_FIXTURE: 1
          SPACE_TEST_REQUIRE_SSH_BACKEND: 1
        run: xvfb-run -a ctest --test-dir build --output-on-failure -V --parallel "$(nproc)"

      - name: Run e2e test suite
        run: make test-e2e

  build-windows:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: write
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache-windows
      CCACHE_MAXSIZE: 1G
      CCACHE_BASEDIR: ${{ github.workspace }}
      SCCACHE_DIR: ${{ github.workspace }}/.sccache-windows
      SCCACHE_CACHE_SIZE: 2G
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      CMAKE_GENERATOR: Ninja
      VCPKG_FEATURE_FLAGS: binarycaching
      VCPKG_BINARY_SOURCES: ${{ github.event_name == 'pull_request' && 'clear;x-gha,read' || 'clear;x-gha,readwrite' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Windows cross-build cache
        uses: ./.github/actions/setup-windows-cross-cache
        with:
          cache-scope: windows-cross
          ccache-path: .ccache-windows
          sccache-path: .sccache-windows
          export-vcpkg-cache-runtime: true
          ccache-key-files: |
            **/CMakeLists.txt
            **/*.cmake
            apps/space/windows_app.rc.in
            scripts/build-windows.sh
            scripts/build-windows-from-linux.sh
            scripts/setup-windows-build-host.sh
            scripts/prepare-windows-runtime.sh
            scripts/prepare-windows-wine-runtime.sh
            scripts/generate_windows_icon.py
          sccache-key-files: |
            ffi/matrix/Cargo.lock
            ffi/matrix/Cargo.toml
            external/wallet-core/rust/Cargo.lock
            external/wallet-core/rust/Cargo.toml
            CMakeLists.txt
            scripts/build-windows.sh
            scripts/build-windows-from-linux.sh
            scripts/setup-windows-build-host.sh

      - name: Setup Windows cross-build host
        run: scripts/setup-windows-build-host.sh

      - name: Build Windows target
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: scripts/build-windows-from-linux.sh

      - name: Prepare runtime bundle
        run: scripts/package-windows-runtime.sh

      - name: Smoke test Windows package
        run: |
          scripts/prepare-windows-wine-runtime.sh build/windows/space-cli.exe
          test -f build/dist/windows/space.exe
          test -f build/dist/windows/space-cli.exe
          x86_64-w64-mingw32-objdump -p build/windows/space.exe | rg "Subsystem.*Windows GUI"
          x86_64-w64-mingw32-objdump -p build/windows/space-cli.exe | rg "Subsystem.*Windows CUI"
          if command -v wine64 >/dev/null 2>&1; then
            WINE_CMD=wine64
          elif command -v wine >/dev/null 2>&1; then
            WINE_CMD=wine
          else
            echo "Missing required command: wine64 or wine" >&2
            exit 1
          fi
          timeout 60s "${WINE_CMD}" build/windows/space-cli.exe --help >/dev/null

      - name: ccache stats
        run: ccache -s

      - name: sccache stats
        run: |
          if command -v sccache >/dev/null 2>&1; then
            sccache --show-stats
            sccache --stop-server || true
          fi

      - name: Upload Windows runtime
        uses: actions/upload-artifact@v5
        with:
          name: space-windows-runtime
          path: build/dist/windows
          if-no-files-found: error

  test-windows:
    needs: build-windows
    runs-on: windows-latest
    env:
      SKIP_KEYRING_TESTS: 1
      SPACE_DISABLE_AUDIO: 1
      SPACE_MATRIX_TEST: ${{ secrets.MATRIX_USERNAME != '' && secrets.MATRIX_PASSWORD != '' && '1' || '' }}
      MATRIX_USERNAME: ${{ secrets.MATRIX_USERNAME }}
      MATRIX_PASSWORD: ${{ secrets.MATRIX_PASSWORD }}
      MATRIX_HOMESERVER: ${{ secrets.MATRIX_HOMESERVER }}
    steps:
      - name: Download Windows runtime
        uses: actions/download-artifact@v5
        with:
          name: space-windows-runtime
          path: build/dist/windows

      - name: Smoke test Windows binary
        run: .\build\dist\windows\space-cli.exe --help | Out-Null

      - name: Run Windows fast suite
        env:
          SPACE_ASSETS_PATH: ${{ github.workspace }}\\build\\dist\\windows\\assets
          SPACE_BIN: ${{ github.workspace }}\\build\\dist\\windows\\space-cli.exe
          FENNEL_PATH: ${{ github.workspace }}\\build\\dist\\windows\\assets\\lua\\?.fnl;${{ github.workspace }}\\build\\dist\\windows\\assets\\lua\\?\\init.fnl
          FENNEL_MACRO_PATH: ${{ github.workspace }}\\build\\dist\\windows\\assets\\lua\\?.fnl;${{ github.workspace }}\\build\\dist\\windows\\assets\\lua\\?\\init.fnl
          XDG_DATA_HOME: ${{ github.workspace }}\\.tmp\\xdg-data
        run: .\build\dist\windows\space-cli.exe -m tests.fast:main
