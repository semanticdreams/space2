name: test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-22.04
    env:
      SKIP_KEYRING_TESTS: 1
      XDG_DATA_HOME: /tmp/space/tests/xdg-data
      SPACE_DISABLE_AUDIO: 1
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 1G
      CCACHE_BASEDIR: ${{ github.workspace }}
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      SCCACHE_CACHE_SIZE: 2G
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Restore ccache
        uses: actions/cache@v5
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-linux-${{ github.ref }}-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake', 'scripts/build-linux.sh', 'scripts/build-appimage.sh', 'Makefile') }}
          restore-keys: |
            ccache-${{ runner.os }}-linux-${{ github.ref }}-
            ccache-${{ runner.os }}-linux-
            ccache-${{ runner.os }}-

      - name: Restore sccache
        uses: actions/cache@v5
        with:
          path: .sccache
          key: sccache-${{ runner.os }}-linux-${{ github.ref }}-${{ hashFiles('ffi/matrix/Cargo.lock', 'ffi/matrix/Cargo.toml', 'external/wallet-core/rust/Cargo.lock', 'external/wallet-core/rust/Cargo.toml', 'CMakeLists.txt') }}
          restore-keys: |
            sccache-${{ runner.os }}-linux-${{ github.ref }}-
            sccache-${{ runner.os }}-linux-
            sccache-${{ runner.os }}-

      - name: Install dependencies
        run: |
          sudo apt-get update
          deps=$(awk '/CI_DEPS_START/{flag=1;next}/CI_DEPS_END/{flag=0}flag' docs/dev/building.md | sed -n 's/^sudo apt install //p')
          # sccache not available via apt on Ubuntu 22.04 — install via cargo below
          deps=$(echo "$deps" | sed 's/\bsccache\b//g')
          sudo apt-get install -y ${deps} ccache

      - name: Install sccache
        run: cargo install sccache --version 0.16.0 --locked

      - name: Configure git for test directories
        run: |
          git config --global user.name "CI Test"
          git config --global user.email "ci@test.local"
          git config --global --add safe.directory /tmp/space/tests
          git config --global --add safe.directory '*'
          git config --global protocol.file.allow always
          echo "=== git config safe.directory ==="
          git config --global --get-all safe.directory || echo "(none)"
          echo "=== git config protocol.file.allow ==="
          git config --global protocol.file.allow || echo "(none)"
          echo "=== GIT_CONFIG env vars ==="
          echo "GIT_CONFIG_NOSYSTEM=${GIT_CONFIG_NOSYSTEM:-unset}"
          echo "GIT_CONFIG_GLOBAL=${GIT_CONFIG_GLOBAL:-unset}"
          echo "HOME=$HOME"

      - name: Check OpenCode capability wiring
        run: make opencode-check

      - name: Build
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: make build

      - name: Run constraints
        run: make constraints

      - name: ccache stats
        run: ccache -s

      - name: sccache stats
        run: |
          if command -v sccache >/dev/null 2>&1; then
            sccache --show-stats
            sccache --stop-server || true
          fi

      - name: Run test suite
        env:
          SPACE_ASSETS_PATH: ${{ github.workspace }}/assets
        run: xvfb-run -a ctest --test-dir build --output-on-failure -V

      - name: Run e2e test suite
        run: make test-e2e

  build-windows:
    if: github.event_name == 'push'
    runs-on: ubuntu-22.04
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache-windows
      CCACHE_MAXSIZE: 1G
      CCACHE_BASEDIR: ${{ github.workspace }}
      SCCACHE_DIR: ${{ github.workspace }}/.sccache-windows
      SCCACHE_CACHE_SIZE: 2G
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Restore ccache
        uses: actions/cache@v5
        with:
          path: .ccache-windows
          key: ccache-${{ runner.os }}-windows-cross-${{ github.ref }}-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake', 'apps/space/windows_app.rc.in', 'scripts/build-windows.sh', 'scripts/build-windows-from-linux.sh', 'scripts/setup-windows-build-host.sh', 'scripts/prepare-windows-runtime.sh', 'scripts/prepare-windows-wine-runtime.sh', 'scripts/generate_windows_icon.py', 'scripts/build-windows-installer.py', 'scripts/windows-installer.iss') }}
          restore-keys: |
            ccache-${{ runner.os }}-windows-cross-${{ github.ref }}-
            ccache-${{ runner.os }}-windows-cross-

      - name: Restore sccache
        uses: actions/cache@v5
        with:
          path: .sccache-windows
          key: sccache-${{ runner.os }}-windows-cross-${{ github.ref }}-${{ hashFiles('ffi/matrix/Cargo.lock', 'ffi/matrix/Cargo.toml', 'external/wallet-core/rust/Cargo.lock', 'external/wallet-core/rust/Cargo.toml', 'CMakeLists.txt', 'scripts/build-windows.sh', 'scripts/build-windows-from-linux.sh', 'scripts/setup-windows-build-host.sh') }}
          restore-keys: |
            sccache-${{ runner.os }}-windows-cross-${{ github.ref }}-
            sccache-${{ runner.os }}-windows-cross-

      - name: Setup Windows cross-build host
        run: scripts/setup-windows-build-host.sh

      - name: Build Windows target
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: scripts/build-windows-from-linux.sh

      - name: Prepare runtime bundle
        run: scripts/package-windows-runtime.sh

      - name: ccache stats
        run: ccache -s

      - name: sccache stats
        run: |
          if command -v sccache >/dev/null 2>&1; then
            sccache --show-stats
            sccache --stop-server || true
          fi

      - name: Upload Windows runtime
        uses: actions/upload-artifact@v5
        with:
          name: space-windows-runtime
          path: build/dist/windows
          if-no-files-found: error

  test-windows:
    if: github.event_name == 'push'
    needs: build-windows
    runs-on: windows-latest
    env:
      SKIP_KEYRING_TESTS: 1
      SPACE_DISABLE_AUDIO: 1
      SPACE_MATRIX_TEST: ${{ secrets.MATRIX_USERNAME != '' && secrets.MATRIX_PASSWORD != '' && '1' || '' }}
      MATRIX_USERNAME: ${{ secrets.MATRIX_USERNAME }}
      MATRIX_PASSWORD: ${{ secrets.MATRIX_PASSWORD }}
      MATRIX_HOMESERVER: ${{ secrets.MATRIX_HOMESERVER }}
    steps:
      - name: Download Windows runtime
        uses: actions/download-artifact@v5
        with:
          name: space-windows-runtime
          path: build/dist/windows

      - name: Smoke test Windows binary
        run: .\build\dist\windows\space-cli.exe --help | Out-Null

      - name: Run Windows fast suite
        env:
          SPACE_ASSETS_PATH: ${{ github.workspace }}\\build\\dist\\windows\\assets
          FENNEL_PATH: ${{ github.workspace }}\\build\\dist\\windows\\assets\\lua\\?.fnl;${{ github.workspace }}\\build\\dist\\windows\\assets\\lua\\?\\init.fnl
          FENNEL_MACRO_PATH: ${{ github.workspace }}\\build\\dist\\windows\\assets\\lua\\?.fnl;${{ github.workspace }}\\build\\dist\\windows\\assets\\lua\\?\\init.fnl
          XDG_DATA_HOME: ${{ github.workspace }}\\.tmp\\xdg-data
        run: .\build\dist\windows\space-cli.exe -m tests.fast:main
