name: Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  SPACE_RELEASE_HEADLESS_SMOKE_MODULE: tests.test-headless-engine-run:main
  SPACE_RELEASE_CEF_SMOKE_MODULE: tests.test-cef-browser-smoke:main

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: full
          - profile: minimal
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 1G
      CCACHE_BASEDIR: ${{ github.workspace }}
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      SCCACHE_CACHE_SIZE: 2G
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Restore ccache
        uses: actions/cache@v5
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-linux-${{ github.ref }}-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake', 'scripts/build-linux.sh', 'scripts/build-appimage.sh', 'Makefile') }}
          restore-keys: |
            ccache-${{ runner.os }}-linux-${{ github.ref }}-
            ccache-${{ runner.os }}-linux-
            ccache-${{ runner.os }}-

      - name: Restore sccache
        uses: actions/cache@v5
        with:
          path: .sccache
          key: sccache-${{ runner.os }}-linux-${{ github.ref }}-${{ hashFiles('ffi/matrix/Cargo.lock', 'ffi/matrix/Cargo.toml', 'external/wallet-core/rust/Cargo.lock', 'external/wallet-core/rust/Cargo.toml', 'CMakeLists.txt') }}
          restore-keys: |
            sccache-${{ runner.os }}-linux-${{ github.ref }}-
            sccache-${{ runner.os }}-linux-
            sccache-${{ runner.os }}-

      - name: Install dependencies
        run: |
          sudo apt-get update
          deps=$(awk '/CI_DEPS_START/{flag=1;next}/CI_DEPS_END/{flag=0}flag' docs/dev/building.md | sed -n 's/^sudo apt install //p')
          # sccache not available via apt on Ubuntu 22.04 — install via cargo below
          deps=$(echo "$deps" | sed 's/\bsccache\b//g')
          sudo apt-get install -y ${deps} ccache rpm

      - name: Install sccache
        run: cargo install sccache --version 0.16.0 --locked

      - name: Configure and Build
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: scripts/build-linux.sh --profile ${{ matrix.profile }} --package-mode all

      - name: Smoke test Linux bundles (host)
        run: |
          if [[ "${{ matrix.profile }}" == "full" ]]; then
            tarball="$(realpath "build/dist/space-linux-x86_64.tar.gz")"
          else
            tarball="$(realpath "build/dist/space-linux-x86_64-minimal.tar.gz")"
          fi
          test -f "${tarball}"
          rm -rf /tmp/space-tarball-smoke
          mkdir -p /tmp/space-tarball-smoke
          tar -xzf "${tarball}" -C /tmp/space-tarball-smoke
          test -x /tmp/space-tarball-smoke/space
          scripts/verify-linux-package-layout.sh --root /tmp/space-tarball-smoke --profile "${{ matrix.profile }}"
          timeout 30s env SPACE_DISABLE_AUDIO=1 SPACE_SKIP_CEF=1 \
            /tmp/space-tarball-smoke/space -m "${SPACE_RELEASE_HEADLESS_SMOKE_MODULE}"
          if [[ "${{ matrix.profile }}" == "full" ]]; then
            timeout 60s env SPACE_DISABLE_AUDIO=1 \
              xvfb-run --auto-servernum --server-args="-screen 0 128x128x24 +extension GLX +render" \
              /tmp/space-tarball-smoke/space -m "${SPACE_RELEASE_CEF_SMOKE_MODULE}"
          fi

      - name: Smoke test Linux bundles (Linux distros)
        run: |
          if [[ "${{ matrix.profile }}" == "full" ]]; then
            tarball="space-linux-x86_64.tar.gz"
          else
            tarball="space-linux-x86_64-minimal.tar.gz"
          fi
          for image in ubuntu:22.04 ubuntu:24.04 debian:12 debian:13 fedora:43 fedora:44 opensuse/tumbleweed; do
            docker run --rm \
              -e TARBALL="${tarball}" \
              -e PROFILE="${{ matrix.profile }}" \
              -v "$PWD/build/dist:/work:ro" \
              -v "$PWD/scripts/verify-linux-package-layout.sh:/scripts/verify-linux-package-layout.sh:ro" \
              "${image}" bash -lc '
              set -euo pipefail
              rm -rf /tmp/space-smoke
              mkdir -p /tmp/space-smoke
              tar -xzf "/work/${TARBALL}" -C /tmp/space-smoke
              test -x /tmp/space-smoke/space
              /scripts/verify-linux-package-layout.sh --root /tmp/space-smoke --profile "${PROFILE}"
            '
          done

      - name: Smoke test DEB package (Ubuntu)
        env:
          DEB_NAME: ${{ matrix.profile == 'full' && 'space-linux-amd64.deb' || 'space-linux-amd64-minimal.deb' }}
        run: |
          test -f "build/${DEB_NAME}"
          docker run --rm \
            -e DEB_NAME="${DEB_NAME}" \
            -e PROFILE="${{ matrix.profile }}" \
            -v "$PWD/build:/build:ro" \
            -v "$PWD/scripts/verify-linux-package-layout.sh:/scripts/verify-linux-package-layout.sh:ro" \
            ubuntu:22.04 bash -lc '
            set -euo pipefail
            apt-get update -qq
            apt-get install -y -qq "/build/${DEB_NAME}"
            /scripts/verify-linux-package-layout.sh --root /usr --profile "${PROFILE}"
            timeout 30s env SPACE_DISABLE_AUDIO=1 SPACE_SKIP_CEF=1 \
              /usr/bin/space -m tests.test-headless-engine-run:main
            '

      - name: Verify RPM package layout (Fedora)
        env:
          RPM_NAME: ${{ matrix.profile == 'full' && 'space-linux-x86_64.rpm' || 'space-linux-x86_64-minimal.rpm' }}
        run: |
          test -f "build/${RPM_NAME}"
          docker run --rm \
            -e RPM_NAME="${RPM_NAME}" \
            -e PROFILE="${{ matrix.profile }}" \
            -v "$PWD/build:/build:ro" \
            -v "$PWD/scripts/verify-linux-package-layout.sh:/scripts/verify-linux-package-layout.sh:ro" \
            fedora:43 bash -lc '
            set -euo pipefail
            rpm -i "/build/${RPM_NAME}"
            /scripts/verify-linux-package-layout.sh --root /usr --profile "${PROFILE}"
            '

      - name: ccache stats
        run: ccache -s

      - name: sccache stats
        run: |
          if command -v sccache >/dev/null 2>&1; then
            sccache --show-stats
            sccache --stop-server || true
          fi

      - name: Resolve release artifacts
        id: linux-release-artifacts
        run: |
          manifest="build/release-artifacts-${{ matrix.profile }}.txt"
          test -f "${manifest}"
          {
            echo 'files<<EOF'
            cat "${manifest}"
            echo 'EOF'
          } >> "${GITHUB_OUTPUT}"

      - name: Verify release artifacts
        run: |
          manifest="build/release-artifacts-${{ matrix.profile }}.txt"
          test -f "${manifest}"
          while IFS= read -r artifact; do
            test -n "${artifact}"
            test -f "${artifact}"
          done < "${manifest}"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          files: ${{ steps.linux-release-artifacts.outputs.files }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    runs-on: ubuntu-22.04
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache-windows
      CCACHE_MAXSIZE: 1G
      CCACHE_BASEDIR: ${{ github.workspace }}
      SCCACHE_DIR: ${{ github.workspace }}/.sccache-windows
      SCCACHE_CACHE_SIZE: 2G
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
    steps:
      - uses: actions/checkout@v5

      - name: Restore ccache
        uses: actions/cache@v5
        with:
          path: .ccache-windows
          key: ccache-${{ runner.os }}-windows-cross-${{ github.ref }}-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake', 'apps/space/windows_app.rc.in', 'scripts/build-windows.sh', 'scripts/build-windows-from-linux.sh', 'scripts/setup-windows-build-host.sh', 'scripts/prepare-windows-runtime.sh', 'scripts/prepare-windows-wine-runtime.sh', 'scripts/generate_windows_icon.py', 'scripts/build-windows-installer.py', 'scripts/windows-installer.iss') }}
          restore-keys: |
            ccache-${{ runner.os }}-windows-cross-${{ github.ref }}-
            ccache-${{ runner.os }}-windows-cross-

      - name: Restore sccache
        uses: actions/cache@v5
        with:
          path: .sccache-windows
          key: sccache-${{ runner.os }}-windows-cross-${{ github.ref }}-${{ hashFiles('ffi/matrix/Cargo.lock', 'ffi/matrix/Cargo.toml', 'external/wallet-core/rust/Cargo.lock', 'external/wallet-core/rust/Cargo.toml', 'CMakeLists.txt', 'scripts/build-windows.sh', 'scripts/build-windows-from-linux.sh', 'scripts/setup-windows-build-host.sh') }}
          restore-keys: |
            sccache-${{ runner.os }}-windows-cross-${{ github.ref }}-
            sccache-${{ runner.os }}-windows-cross-

      - name: Setup Windows cross-build host
        run: scripts/setup-windows-build-host.sh

      - name: Configure and Build
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: scripts/build-windows-from-linux.sh

      - name: Prepare runtime and bundle artifacts
        run: scripts/package-windows-runtime.sh

      - name: Smoke test Windows binary
        run: |
          scripts/prepare-windows-wine-runtime.sh build/windows/space.exe
          test -f build/dist/windows/space.exe
          timeout 60s wine64 build/windows/space.exe --help >/dev/null

      - name: Create ZIP
        run: |
          python3 - <<'PY'
          import pathlib
          import zipfile

          root = pathlib.Path("build/dist/windows")
          with zipfile.ZipFile("build/dist/space-windows-x86_64.zip", "w", zipfile.ZIP_DEFLATED) as archive:
              for path in root.rglob("*"):
                  archive.write(path, path.relative_to(root))
          PY

      - name: ccache stats
        run: ccache -s

      - name: sccache stats
        run: |
          if command -v sccache >/dev/null 2>&1; then
            sccache --show-stats
            sccache --stop-server || true
          fi

      - name: Upload Windows packaging inputs
        uses: actions/upload-artifact@v4
        with:
          name: windows-packaging-inputs
          path: |
            build/dist/space-windows-x86_64.zip
            build/dist/windows
            build/windows/CPackConfig.cmake
            build/windows/space.ico
            scripts/windows-installer.iss

  build-windows-installer:
    runs-on: windows-latest
    needs: build-windows
    steps:
      - uses: actions/checkout@v5

      - name: Download Windows packaging inputs
        uses: actions/download-artifact@v4
        with:
          name: windows-packaging-inputs
          path: .

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        shell: pwsh
        run: python scripts/build-windows-installer.py

      - name: Smoke test Windows installer
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP "space-install"
          $logPath = Join-Path $env:RUNNER_TEMP "space-installer.log"
          Remove-Item -Recurse -Force $installDir -ErrorAction SilentlyContinue
          Remove-Item $logPath -ErrorAction SilentlyContinue
          $installer = (Resolve-Path "build/dist/space-windows-x86_64-setup.exe").Path
          Start-Process -FilePath $installer -ArgumentList @("/SP-","/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/CURRENTUSER","/TASKS=desktopicon",("/DIR=" + $installDir),("/LOG=" + $logPath)) -Wait -NoNewWindow
          if (-not (Test-Path (Join-Path $installDir "space.exe"))) {
            if (Test-Path $logPath) {
              Get-Content $logPath
            }
            throw "Installed executable not found."
          }
          & (Join-Path $installDir "space.exe") --help *> $null

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          files: |
            build/dist/space-windows-x86_64.zip
            build/dist/space-windows-x86_64-setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
